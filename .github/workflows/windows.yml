name: Windows x64 build

on:
  workflow_dispatch:
    inputs:
      qt:
        description: 'Версия Qt: пусто = по умолчанию, qt6 = Qt 6'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - qt6

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Check Windows build files exist.
        shell: bash
        run: |
          if [ ! -f "$TBUILD/$REPO_NAME/Telegram/build/prepare/win.bat" ] || [ ! -f "$TBUILD/$REPO_NAME/Telegram/configure.bat" ]; then
            echo "::error::В репозитории нет Telegram/build/prepare/win.bat или Telegram/configure.bat. Скопируйте их (и Telegram/build/prepare/) из telegramdesktop/tdesktop той же версии."
            exit 1
          fi

      - name: Patch prepare.py (diffutils).
        shell: bash
        run: |
          sed -i 's/mingw-w64-x86_64-diffutils/diffutils/' "$TBUILD/$REPO_NAME/Telegram/build/prepare/prepare.py"
          grep -n "diffutils" "$TBUILD/$REPO_NAME/Telegram/build/prepare/prepare.py"

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK=""
          if [ -f "$DOCPATH" ]; then
            SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          fi
          echo "SDK=$SDK" >> $GITHUB_ENV
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake
          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV
          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v3-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-v3-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-${{ inputs.qt || 'qt' }}-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-${{ inputs.qt || 'qt' }}-

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent ${{ inputs.qt }}

      - name: API credentials.
        shell: bash
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            echo "TDESKTOP_BUILD_API=-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH" >> $GITHUB_ENV
          else
            echo "::warning::Секреты TDESKTOP_API_ID / TDESKTOP_API_HASH не заданы. Сборка будет работать только с тестовыми серверами Telegram."
            echo "TDESKTOP_BUILD_API=-D TDESKTOP_API_TEST=ON" >> $GITHUB_ENV
          fi

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Save ThirdParty cache.
        if: steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}

      - name: Save libraries cache.
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v3-${{ env.CACHE_KEY }}

      - name: Save Qt cache.
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-${{ inputs.qt || 'qt' }}-${{ env.CACHE_KEY }}

      - name: Build.
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram
          call configure.bat ^
          x64 ^
          ${{ inputs.qt }} ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          cmake --build ..\out --config Release --parallel

      - name: Collect artifact.
        run: |
          mkdir artifact
          copy %TBUILD%\%REPO_NAME%\out\Release\*.exe artifact\

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        with:
          name: DiveGram-windows-x64
          path: artifact\
          retention-days: 7
